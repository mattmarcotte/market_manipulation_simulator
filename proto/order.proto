syntax = "proto3";

package order;

service OrderService {
  // Place a market order (buy or sell)
  rpc PlaceOrder (PlaceOrderRequest) returns (PlaceOrderResponse);

  // Get status of a previously placed order
  rpc GetOrderStatus (GetOrderStatusRequest) returns (GetOrderStatusResponse);
}

message PlaceOrderRequest {
  string account_id = 1;
  string symbol = 2;
  string side = 3; // "buy", "sell", "short", or "cover"
  int32 shares = 4;
  double leverage = 5; // 1-5x, only meaningful for "buy" and "short"; treat 0 as 1
}

message PlaceOrderResponse {
  bool success = 1;
  string order_id = 2;
  string error = 3;
  double fill_price = 4;
  string status = 5; // "filled", "rejected"
}

message GetOrderStatusRequest {
  string order_id = 1;
}

message GetOrderStatusResponse {
  string order_id = 1;
  string status = 2;
  string symbol = 3;
  string side = 4;
  int32 shares = 5;
  double fill_price = 6;
  int64 timestamp = 7;
}
